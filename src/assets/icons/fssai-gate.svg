<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="currentColor">
  <!-- Left Support Post -->
  <rect x="5" y="14" width="4.5" height="22" rx="1.5" />
  <rect x="3" y="34" width="8.5" height="3" rx="1.2" />
  <!-- Pivot Joint -->
  <circle cx="7.25" cy="18" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2" />
  <!-- Barrier Arm (horizontal/slight incline) -->
  <rect x="8" y="16.5" width="28" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.4" />
  <!-- Diagonal Warning Stripes inside barrier arm -->
  <line x1="14" y1="17.5" x2="18" y2="20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
  <line x1="22" y1="17.5" x2="26" y2="20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
  <line x1="30" y1="17.5" x2="34" y2="20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
  <!-- Circular sign / indicator hanging from arm -->
  <circle cx="27" cy="27" r="3" fill="none" stroke="currentColor" stroke-width="2" />
  <line x1="27" y1="21.5" x2="27" y2="24" stroke="currentColor" stroke-width="2" />
</svg>
